name: Backend tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # AnimalShelterApplicationTests (contextLoads) necesita MySQL y variables de entorno;
      # se excluye hasta añadir un servicio de base de datos al workflow.
      - run: bash ./mvnw -B test -Dtest='!AnimalShelterApplicationTests'
